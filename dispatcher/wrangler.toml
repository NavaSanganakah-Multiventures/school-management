# VidyaSetu — Workers for Platforms dispatcher worker.
#
# Routes '*.pragnya.nasven.com' subdomains through the dispatch namespace.
# The apex ('pragnya.nasven.com') stays on the shared 'school-management' worker.
name = "school-management-dispatcher"
main = "./index.js"
compatibility_date = "2026-09-01"

[[routes]]
pattern = "*.pragnya.nasven.com/*"
zone_name = "nasven.com"

[[dispatch_namespaces]]
binding = "DISPATCHER"
namespace = "school-management-dispatch"
# Uncomment for local development against the remote namespace:
# remote = true

[vars]
DISPATCH_BASE_DOMAIN = "pragnya.nasven.com"
