name = "school-management"
main = "./api/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Dedicated-school subdomains resolve to their own per-school worker
# (slug.pragnya.nasven.com/*) generated by scripts/generate-school-configs.mjs.
# This wildcard also covers the public website (pragnya.nasven.com) and serves
# as a fallback for unclaimed subdomains — every school runs dedicated.

[[routes]]
pattern = "*.pragnya.nasven.com/*"
zone_name = "nasven.com"

# Cloudflare Workers + Assets: public Website (Next.js static export) + Worker API.
# pragnya.nasven.com is the PUBLIC WEBSITE — landing page + school registration
# (instant 7-day free trial, no admin approval) + portfolio. Served from the
# Next.js static export (out/), built with `npm run build` (see
# .github/workflows/deploy.yml). School staff use their dedicated per-school
# portal (slug.pragnya.nasven.com), which serves flutter_apps/school_management_app
# via generated wrangler-<slug>.toml. The Super Admin console lives at
# admin.pragnya.nasven.com (see wrangler.admin.toml / deploy-admin.yml).
[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Production bindings (top-level — used by `npx wrangler deploy` without --env)
[[d1_databases]]
binding = "DB"
database_id = "16648fed-788d-4780-a877-fac56d9b5d27"
migrations_dir = "./db_migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "school-management-production"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "393901911be84d558822c78070a82e94"

# Cloudflare Email Service binding — sends password reset / invite emails.
[[send_email]]
name = "SEND_EMAIL"

# Scheduled Cron Trigger (Daily at 03:00 UTC / 08:30 AM IST for trial expiration processing)
[triggers]
crons = ["0 3 * * *"]

[vars]
ENVIRONMENT = "production"
# FCM project id is derived from FCM_SERVICE_ACCOUNT_JSON.project_id (see api/lib/fcm.ts).
SCHOOL_NAME = "Pragnya Mitra Public School"
APP_BASE_URL = "https://pragnya.nasven.com"
WEB_PUSH_VAPID_PUBLIC_KEY = "BJlcKjZBfC5YzmoIxZ1ndHRJAiemr7Rdi4LBuceK6GI7N6g9aV3ctHpKCtZ8RbaPugnfvfJQNBiRTi63CGipHP4"
WEB_PUSH_VAPID_SUBJECT = "mailto:pragnya@navasanganakah.com"

