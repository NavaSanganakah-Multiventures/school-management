name = "school-management"
main = "./api/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# THE PUBLIC WEBSITE IS ONLY HERE. This route is deliberately apex-only.
#
# This used to be the wildcard `*.pragnya.nasven.com/*`, described in a comment
# as a fallback for unclaimed subdomains. The fallback was the problem: this
# worker's static assets are the marketing website, so every school subdomain
# without a deployed dedicated worker rendered the 84 KB landing page. Verified
# in production:
#
#   pragnya.nasven.com              -> website   (intended)
#   school795082.pragnya...         -> school app (intended, isDedicated:true)
#   school813529.pragnya...         -> WEBSITE   (trial, not yet provisioned)
#   a-random-unclaimed-slug...     -> WEBSITE   (subdomain does not exist)
#
# Because POST /api/auth/register is instant-trial, every new customer is handed
# `https://<slug>.pragnya.nasven.com` immediately, while the dedicated worker
# only exists after the next deploy. In that window the customer's own "portal"
# link showed them the marketing site, and its /api/config reported the platform
# placeholder tenant `school-01` rather than their school.
#
# Routing the website to a subdomain that belongs to a school is exactly the
# confusion this caused, so there is now no wildcard to fall through to. An
# unclaimed subdomain gets Cloudflare's error instead of the wrong application,
# which is the honest answer. Dedicated schools are unaffected: each has its own
# explicit `<slug>.pragnya.nasven.com/*` route from
# scripts/generate-school-configs.mjs, and admin.pragnya.nasven.com has its own in
# wrangler.admin.toml.

[[routes]]
pattern = "pragnya.nasven.com/*"
zone_name = "nasven.com"

# Cloudflare Workers + Assets: public Website (Next.js static export) + Worker API.
# pragnya.nasven.com is the PUBLIC WEBSITE — landing page + school registration
# (instant 7-day free trial, no admin approval) + portfolio. Served from the
# Next.js static export (out/), built with `npm run build` (see
# .github/workflows/deploy.yml). School staff use their dedicated per-school
# portal (slug.pragnya.nasven.com), which serves flutter_apps/school_management_app
# via generated wrangler-<slug>.toml. The Super Admin console lives at
# admin.pragnya.nasven.com (see wrangler.admin.toml / deploy-admin.yml).
[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Production bindings (top-level — used by `npx wrangler deploy` without --env)
[[d1_databases]]
binding = "DB"
database_id = "16648fed-788d-4780-a877-fac56d9b5d27"
migrations_dir = "./db_migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "school-management-production"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "393901911be84d558822c78070a82e94"

# Cloudflare Email Service binding — sends password reset / invite emails.
[[send_email]]
name = "SEND_EMAIL"

# Scheduled Cron Trigger (Daily at 03:00 UTC / 08:30 AM IST for trial expiration processing)
[triggers]
crons = ["0 3 * * *"]

[vars]
ENVIRONMENT = "production"
# FCM project id is derived from FCM_SERVICE_ACCOUNT_JSON.project_id (see api/lib/fcm.ts).
SCHOOL_NAME = "Pragnya Mitra Public School"
APP_BASE_URL = "https://pragnya.nasven.com"
WEB_PUSH_VAPID_PUBLIC_KEY = "BJlcKjZBfC5YzmoIxZ1ndHRJAiemr7Rdi4LBuceK6GI7N6g9aV3ctHpKCtZ8RbaPugnfvfJQNBiRTi63CGipHP4"
WEB_PUSH_VAPID_SUBJECT = "mailto:pragnya@navasanganakah.com"

# -------------------------------------------------------------
# Preview Environment
# -------------------------------------------------------------
[env.preview]
name = "school-management-preview"
# Explicitly NO routes. Without this the env inherits the top-level
# `pragnya.nasven.com/*` pattern and the deploy fails with "Can't deploy routes
# that are assigned to another worker", because production already owns that
# pattern. An empty list means the preview is reachable only through its
# workers.dev URL, which is what a smoke environment should be.
routes = []

[[env.preview.d1_databases]]
binding = "DB"
database_id = "5d969580-4ef9-42eb-9d07-f1e08e1dc599"
migrations_dir = "./db_migrations"

[[env.preview.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "school-management-preview"

[[env.preview.kv_namespaces]]
binding = "CONFIG_KV"
id = "9158f79162824ee1b52e75fe51af71f8"

# Email binding for the preview env too. Without it api/lib/email.ts
# short-circuits every send, so a preview smoke test would report a successful
# password reset that never actually delivered a message.
[[env.preview.send_email]]
name = "SEND_EMAIL"

# `vars` are NOT inherited by environments, so APP_BASE_URL must be repeated
# here or wrangler warns and the preview worker has none. The deploy-preview
# workflow overrides it with the real workers.dev URL once that hostname is
# known, so password-reset links point at the running preview and not a
# placeholder.
[env.preview.vars]
APP_BASE_URL = "https://school-management-preview.workers.dev"
ENVIRONMENT = "preview"
WEB_PUSH_VAPID_PUBLIC_KEY = "BJlcKjZBfC5YzmoIxZ1ndHRJAiemr7Rdi4LBuceK6GI7N6g9aV3ctHpKCtZ8RbaPugnfvfJQNBiRTi63CGipHP4"
WEB_PUSH_VAPID_SUBJECT = "mailto:pragnya@navasanganakah.com"
# FCM project id is derived from FCM_SERVICE_ACCOUNT_JSON.project_id (see api/lib/fcm.ts).
SCHOOL_NAME = "Pragnya Mitra Public School (Preview)"
