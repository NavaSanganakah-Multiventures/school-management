name = "school-management"
main = "./api/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers + Assets: static frontend (out/) + Worker API (api/index.ts)
[assets]
directory = "./out"
binding = "ASSETS"

# Production bindings (top-level — used by `npx wrangler deploy` without --env)
[[d1_databases]]
binding = "DB"
database_id = "16648fed-788d-4780-a877-fac56d9b5d27"
migrations_dir = "./db_migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "school-management-production"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "393901911be84d558822c78070a82e94"

# Cloudflare Email Service binding — sends password reset / invite emails.
[[send_email]]
name = "SEND_EMAIL"

[vars]
ENVIRONMENT = "production"
# Zero-DB-Cost Edge Environment (Fastest 0ms reads directly from Worker env)
SCHOOL_ID = "school-01"
SCHOOL_NAME = "प्रज्ञा मित्र स्कूल प्रबंधन (Pragnya Mitra)"
CONTACT_PHONE = "+91 9876543210"
CONTACT_EMAIL = "director@pragnyamitra.com"
BOARD_NAME = "CBSE"
ACADEMIC_SESSION = "2026-2027"
LOGO_URL = "/icon.svg"
APP_BASE_URL = "https://pragnyamitra.com"
WEB_PUSH_VAPID_PUBLIC_KEY = "BJlcKjZBfC5YzmoIxZ1ndHRJAiemr7Rdi4LBuceK6GI7N6g9aV3ctHpKCtZ8RbaPugnfvfJQNBiRTi63CGipHP4"
WEB_PUSH_VAPID_SUBJECT = "mailto:director@pragnyamitra.com"

# -------------------------------------------------------------
# Preview Environment
# -------------------------------------------------------------
[env.preview]
name = "school-management-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_id = "5d969580-4ef9-42eb-9d07-f1e08e1dc599"
migrations_dir = "./db_migrations"

[[env.preview.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "school-management-preview"

[[env.preview.kv_namespaces]]
binding = "CONFIG_KV"
id = "9158f79162824ee1b52e75fe51af71f8"

[env.preview.vars]
ENVIRONMENT = "preview"
SCHOOL_ID = "school-01"
SCHOOL_NAME = "प्रज्ञा मित्र स्कूल प्रबंधन (Pragnya Mitra Preview)"
