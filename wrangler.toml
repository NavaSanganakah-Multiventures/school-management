name = "school-management"
main = "./api/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# THE PUBLIC WEBSITE IS ONLY HERE. This route is deliberately apex-only.
#
# This used to be the wildcard `*.pragnya.nasven.com/*`, described in a comment
# as a fallback for unclaimed subdomains. The fallback was the problem: this
# worker's static assets are the marketing website, so every school subdomain
# without a deployed dedicated worker rendered the 84 KB landing page. Verified
# in production:
#
#   pragnya.nasven.com              -> website   (intended)
#   school795082.pragnya...         -> school app (intended, isDedicated:true)
#   school813529.pragnya...         -> WEBSITE   (trial, not yet provisioned)
#   a-random-unclaimed-slug...     -> WEBSITE   (subdomain does not exist)
#
# Because POST /api/auth/register is instant-trial, every new customer is handed
# `https://<slug>.pragnya.nasven.com` immediately, while the dedicated worker
# only exists after the next deploy. In that window the customer's own "portal"
# link showed them the marketing site, and its /api/config reported the platform
# placeholder tenant `school-01` rather than their school.
#
# Routing the website to a subdomain that belongs to a school is exactly the
# confusion this caused, so there is now no wildcard to fall through to. An
# unclaimed subdomain gets Cloudflare's error instead of the wrong application,
# which is the honest answer. Dedicated schools are unaffected: each has its own
# explicit `<slug>.pragnya.nasven.com/*` route from
# scripts/generate-school-configs.mjs, and admin.pragnya.nasven.com has its own in
# wrangler.admin.toml.

[[routes]]
pattern = "pragnya.nasven.com/*"
zone_name = "nasven.com"

# Cloudflare Workers + Assets: public Website (Next.js static export) + Worker API.
# pragnya.nasven.com is the PUBLIC WEBSITE — landing page + school registration
# (instant 7-day free trial, no admin approval) + portfolio. Served from the
# Next.js static export (out/), built with `npm run build` (see
# .github/workflows/deploy.yml). School staff use their dedicated per-school
# portal (slug.pragnya.nasven.com), which serves flutter_apps/school_management_app
# via generated wrangler-<slug>.toml. The Super Admin console lives at
# admin.pragnya.nasven.com (see wrangler.admin.toml / deploy-admin.yml).
[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Production bindings (top-level — used by `npx wrangler deploy` without --env)
[[d1_databases]]
binding = "DB"
database_id = "16648fed-788d-4780-a877-fac56d9b5d27"
migrations_dir = "./db_migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "school-management-production"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "393901911be84d558822c78070a82e94"

# Cloudflare Email Service binding — sends password reset / invite emails.
[[send_email]]
name = "SEND_EMAIL"

# Scheduled Cron Trigger (Daily at 03:00 UTC / 08:30 AM IST for trial expiration processing)
[triggers]
crons = ["0 3 * * *"]

[vars]
ENVIRONMENT = "production"
# FCM project id is derived from FCM_SERVICE_ACCOUNT_JSON.project_id (see api/lib/fcm.ts).
SCHOOL_NAME = "Pragnya Mitra Public School"
APP_BASE_URL = "https://pragnya.nasven.com"
WEB_PUSH_VAPID_PUBLIC_KEY = "BJlcKjZBfC5YzmoIxZ1ndHRJAiemr7Rdi4LBuceK6GI7N6g9aV3ctHpKCtZ8RbaPugnfvfJQNBiRTi63CGipHP4"
WEB_PUSH_VAPID_SUBJECT = "mailto:pragnya@navasanganakah.com"

# -------------------------------------------------------------
# Previews - branch deployments of THIS worker
# -------------------------------------------------------------
# A push to `main` deploys production with the settings above. A push to any
# other branch deploys a Preview of this same worker with the settings below,
# at `<branch>-school-management.<subdomain>.workers.dev`.
#
# This used to be a Wrangler environment (`[env.preview]` +
# name = "school-management-preview"), i.e. a separately deployed Worker.
# Cloudflare documents that model for persistent staging environments and
# explicitly not for branch testing:
#
#   Previews              -> "Full environments for branches and pull requests
#                             under the same Worker"    (npx wrangler preview)
#   Wrangler environments -> "Separately deployed Workers" (deploy --env <name>)
#
# Switching also removes two footguns that the separate worker needed
# workarounds for, and which a reviewer could not see were workarounds:
#
#   - Routes. The old env had to declare `routes = []`, because otherwise it
#     inherited `pragnya.nasven.com/*` and the deploy failed. Previews never
#     take zone routes or production custom domains, so a Preview structurally
#     cannot take over the production website.
#   - Cron. This worker runs a daily trial-expiry cron. Previews get no scheduled
#     invocation, so a Preview cannot double-process trial expiries.
#
# Requires wrangler >= 4.135.0. The [assets] block stays top level: a Preview
# uploads assets from the branch being previewed, so the Next.js export must be
# built (npm run build) or the deploy fails on a missing ./out.
[previews]

# Previews do NOT inherit production settings, so `vars` must be repeated here.
# Without ENVIRONMENT = "preview" the code takes the production branch, e.g.
# api/lib/auth.ts would not fail closed on a missing AUTH_SECRET.
[previews.vars]
# The deploy-preview workflow overrides this with the branch's real Preview URL
# once that hostname is known, so password-reset links point at the running
# Preview rather than a placeholder.
APP_BASE_URL = "https://school-management-preview.workers.dev"
ENVIRONMENT = "preview"
WEB_PUSH_VAPID_PUBLIC_KEY = "BJlcKjZBfC5YzmoIxZ1ndHRJAiemr7Rdi4LBuceK6GI7N6g9aV3ctHpKCtZ8RbaPugnfvfJQNBiRTi63CGipHP4"
WEB_PUSH_VAPID_SUBJECT = "mailto:pragnya@navasanganakah.com"
# FCM project id is derived from FCM_SERVICE_ACCOUNT_JSON.project_id (see api/lib/fcm.ts).
SCHOOL_NAME = "Pragnya Mitra Public School (Preview)"

# One staging D1 shared by every branch, which is Cloudflare's documented
# default. Two Previews bound to the same database_id share rows.
#
# Sharing is safe here because the migrations are ordered and idempotent:
# re-applying them is a no-op, so branches converge on one schema instead of
# racing. The trade-off is that a branch adding a migration changes the database
# every other Preview uses. That widens the schema rather than breaking it, but a
# branch expecting a column another branch just added would test against a schema
# it should not have. A branch needing true isolation overrides both this
# binding and `wrangler.preview-migrations.jsonc`.
#
# Migrations are applied with that second file, not with `--env`:
#   npx wrangler d1 migrations apply PREVIEW_DB --remote \
#     --config wrangler.preview-migrations.jsonc
[[previews.d1_databases]]
binding = "DB"
database_name = "school-management-preview"
database_id = "5d969580-4ef9-42eb-9d07-f1e08e1dc599"
migrations_dir = "./db_migrations"

[[previews.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "school-management-preview"

[[previews.kv_namespaces]]
binding = "CONFIG_KV"
id = "9158f79162824ee1b52e75fe51af71f"

# NOTE: there is deliberately no `send_email` binding on Previews.
#
# api/lib/email.ts short-circuits every send when the binding is absent, which
# is the correct behaviour for a non-production environment. Binding it here
# would let anyone who finds a Preview URL send real email from the real domain:
# POST /api/auth/register accepts an arbitrary address and immediately triggers
# a welcome email, which turns a Preview into a spam relay burning the
# production sending quota. A password reset aimed at a real customer address
# would also deliver, appearing to come from production.
#
# The old [env.preview] did bind SEND_EMAIL. That was a mistake, and the smoke
# suite is written so it never depends on real delivery.
