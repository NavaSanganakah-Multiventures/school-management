name = "school-management"
main = "./api/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers + Assets: static frontend (out/) + Worker API (api/index.ts)
[assets]
directory = "./out"
binding = "ASSETS"

# D1 database (production)
[[d1_databases]]
binding = "DB"
database_id = "16648fed-788d-4780-a877-fac56d9b5d27"
migrations_dir = "./db_migrations"

[vars]
ENVIRONMENT = "production"
FCM_PROJECT_ID = "vidyasetu-school-fcm"
SCHOOL_NAME = "विद्या सेतु पब्लिक स्कूल (VidyaSetu Public School)"
