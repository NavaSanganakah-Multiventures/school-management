name: Sync Secrets (KV → GitHub)

# Syncs app secrets from Cloudflare KV (CONFIG_KV) into GitHub repository
# secrets. KV is the source of truth; the existing deploy workflow reads these
# GitHub secrets unchanged (secrets.XXX). Run this after updating a secret in
# KV, or whenever GitHub secrets need to be re-populated.
#
# Prerequisites (GitHub repo secrets):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with KV read access
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account id
#   GH_SECRETS_SYNC_TOKEN — GitHub PAT with repo + Administration (or fine-grained
#                           "Secrets" repository write permission) to set repo secrets
#
# The default GITHUB_TOKEN cannot write repo secrets, hence the dedicated PAT.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-kv-to-github.mjs'
      - 'scripts/seed-kv-secrets.mjs'
      - '.github/workflows/sync-secrets.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync KV → GitHub repo secrets
        run: node scripts/sync-kv-to-github.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_SYNC_TOKEN }}
