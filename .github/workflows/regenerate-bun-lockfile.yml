name: Regenerate bun.lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Remove incompatible lockfile
        run: rm -f bun.lock bun.lockb

      - name: Regenerate lockfile with Bun 1.2.15
        run: bun install

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Regenerate bun.lock for Bun 1.2.15"
            git push
          fi
