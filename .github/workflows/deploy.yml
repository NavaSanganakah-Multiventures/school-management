name: Deploy VidyaSetu (Next.js + Cloudflare Worker)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
      - run: test -f api/index.ts

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install

      - name: Provision Dedicated Schools
        run: node scripts/provision-school.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate Wrangler Configs
        run: node scripts/generate-school-configs.mjs

      - run: npm run build

      - name: Apply D1 database migrations (Platform/Shared)
        run: npx --yes wrangler@3.90.0 d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Platform/Shared Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: npm
          postCommands: |
            echo "$RAZORPAY_KEY_ID" | npx wrangler secret put RAZORPAY_KEY_ID
            echo "$RAZORPAY_KEY_SECRET" | npx wrangler secret put RAZORPAY_KEY_SECRET
            echo "$AUTH_SECRET" | npx wrangler secret put AUTH_SECRET
            echo "$PLATFORM_ADMIN_EMAIL" | npx wrangler secret put PLATFORM_ADMIN_EMAIL
            echo "$PLATFORM_ADMIN_PASSWORD" | npx wrangler secret put PLATFORM_ADMIN_PASSWORD
            if [ -n "$FCM_SERVICE_ACCOUNT_JSON" ]; then printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | npx wrangler secret put FCM_SERVICE_ACCOUNT_JSON; fi
            if [ -n "$WEB_PUSH_VAPID_PRIVATE_KEY" ]; then printf '%s' "$WEB_PUSH_VAPID_PRIVATE_KEY" | npx wrangler secret put WEB_PUSH_VAPID_PRIVATE_KEY; fi
            printf '%s' "$FIREBASE_WEB_CONFIG_JSON" | npx wrangler secret put FIREBASE_WEB_CONFIG_JSON
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          FIREBASE_WEB_CONFIG_JSON: ${{ secrets.FIREBASE_WEB_CONFIG_JSON }}

      - name: Deploy Dedicated Workers
        run: node scripts/deploy-dedicated.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          FIREBASE_WEB_CONFIG_JSON: ${{ secrets.FIREBASE_WEB_CONFIG_JSON }}
          DEDICATED_SECRETS_JSON: ${{ secrets.DEDICATED_SECRETS_JSON }}

      - name: Bootstrap platform Super Admin (idempotent)
        run: |
          set +e
          for i in 1 2 3 4 5; do
            echo "--- bootstrap attempt $i ---"
            RESP=$(curl -sS -X POST "https://pragnya.nasven.com/api/admin/bootstrap" -H "Content-Type: application/json" -d "{}")
            echo "$RESP"
            if echo "$RESP" | grep -q '"success":true'; then
              echo "BOOTSTRAP_OK"
              break
            fi
            sleep 4
          done
        shell: bash
      - name: Dump wrangler logs (diagnostic)
        if: always()
        run: |
          echo "=== wrangler log files ==="
          ls -la "$HOME/.config/.wrangler/logs" || true
          for f in "$HOME"/.config/.wrangler/logs/*.log
          do
            echo "=== $f ==="
            cat "$f" || true
          done
        shell: bash
