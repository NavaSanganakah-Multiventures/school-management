name: Deploy Pragnya Mitra (Flutter Web + Cloudflare Worker)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_school_data_copy:
        description: "Re-copy ALL shared-D1 operational data into every dedicated D1 (idempotent repair — use after rescuing data stuck in the main DB)"
        required: false
        default: false
        type: boolean

# Serialize deploy runs per branch so concurrent runs (e.g. a platform-API
# schools.json push racing a manual workflow_dispatch) never apply D1
# migrations on the same fresh database at the same time. The queue guarantees a
# clean single migration pass per deploy cycle.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: test -f api/index.ts
      # pragnya.nasven.com serves the Next.js public website (static export).
      - name: Build Website (Next.js static export)
        run: npm run build
      - name: Verify website build output
        run: test -f out/index.html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install

      - name: Provision Dedicated Schools
        run: node scripts/provision-school.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLATFORM_BASE_URL: ${{ vars.PLATFORM_BASE_URL }}
          INTERNAL_SYNC_SECRET: ${{ secrets.INTERNAL_SYNC_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - name: Ensure Wildcard DNS
        run: node scripts/ensure-wildcard-dns.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Generate Wrangler Configs
        run: node scripts/generate-school-configs.mjs
        env:
          PLATFORM_BASE_URL: ${{ vars.PLATFORM_BASE_URL }}
          INTERNAL_SYNC_SECRET: ${{ secrets.INTERNAL_SYNC_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Build Flutter web (release)
        run: |
          cd flutter_apps/school_management_app
          flutter pub get
          flutter build web --release --base-href /

      - name: Verify Flutter web build output
        run: test -f flutter_apps/school_management_app/build/web/index.html

      # pragnya.nasven.com serves the Next.js public website (wrangler.toml [assets]).
      - name: Build Website (Next.js static export)
        run: npm run build

      - name: Verify website build output
        run: test -f out/index.html

      - name: Apply D1 database migrations (Platform/Shared)
        run: npx --yes wrangler@3.90.0 d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Cleanup Legacy Dispatcher Routes
        run: node scripts/cleanup-legacy-dispatcher.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Platform/Shared Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: npm
          postCommands: |
            if [ -n "$RAZORPAY_KEY_ID" ]; then printf '%s' "$RAZORPAY_KEY_ID" | npx wrangler secret put RAZORPAY_KEY_ID; fi
            if [ -n "$RAZORPAY_KEY_SECRET" ]; then printf '%s' "$RAZORPAY_KEY_SECRET" | npx wrangler secret put RAZORPAY_KEY_SECRET; fi
            if [ -n "$AUTH_SECRET" ]; then printf '%s' "$AUTH_SECRET" | npx wrangler secret put AUTH_SECRET; fi
            if [ -n "$PLATFORM_ADMIN_EMAIL" ]; then printf '%s' "$PLATFORM_ADMIN_EMAIL" | npx wrangler secret put PLATFORM_ADMIN_EMAIL; fi
            if [ -n "$PLATFORM_ADMIN_PASSWORD" ]; then printf '%s' "$PLATFORM_ADMIN_PASSWORD" | npx wrangler secret put PLATFORM_ADMIN_PASSWORD; fi
            if [ -n "$FCM_SERVICE_ACCOUNT_JSON" ]; then printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | npx wrangler secret put FCM_SERVICE_ACCOUNT_JSON; fi
            if [ -n "$WEB_PUSH_VAPID_PRIVATE_KEY" ]; then printf '%s' "$WEB_PUSH_VAPID_PRIVATE_KEY" | npx wrangler secret put WEB_PUSH_VAPID_PRIVATE_KEY; fi
            if [ -n "$FIREBASE_WEB_CONFIG_JSON" ]; then printf '%s' "$FIREBASE_WEB_CONFIG_JSON" | npx wrangler secret put FIREBASE_WEB_CONFIG_JSON; fi
            if [ -n "$PROVISIONING_GITHUB_TOKEN" ]; then printf '%s' "$PROVISIONING_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN; fi
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          FIREBASE_WEB_CONFIG_JSON: ${{ secrets.FIREBASE_WEB_CONFIG_JSON }}
          PROVISIONING_GITHUB_TOKEN: ${{ secrets.PROVISIONING_GITHUB_TOKEN }}

      - name: Deploy Dedicated Workers
        run: node scripts/deploy-dedicated.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          FIREBASE_WEB_CONFIG_JSON: ${{ secrets.FIREBASE_WEB_CONFIG_JSON }}
          DEDICATED_SECRETS_JSON: ${{ secrets.DEDICATED_SECRETS_JSON }}
          FORCE_SCHOOL_DATA_COPY: ${{ github.event.inputs.force_school_data_copy == 'true' }}

      - name: Bootstrap platform Super Admin (idempotent)
        run: |
          set +e
          for i in 1 2 3 4 5; do
            echo "--- bootstrap attempt $i ---"
            RESP=$(curl -sS -X POST "https://pragnya.nasven.com/api/admin/bootstrap" -H "Content-Type: application/json" -d "{}")
            echo "$RESP"
            if echo "$RESP" | grep -q '"success":true'; then
              echo "BOOTSTRAP_OK"
              break
            fi
            sleep 4
          done
        shell: bash
      - name: Dump wrangler logs (diagnostic)
        if: always()
        run: |
          echo "=== wrangler log files ==="
          ls -la "$HOME/.config/.wrangler/logs" || true
          for f in "$HOME"/.config/.wrangler/logs/*.log
          do
            echo "=== $f ==="
            cat "$f" || true
          done
        shell: bash
