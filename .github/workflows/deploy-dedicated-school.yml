name: Deploy Dedicated School Worker (Pragnya Mitra)

on:
  workflow_dispatch:
    inputs:
      school_slug:
        description: "School Slug (e.g. dps-delhi)"
        required: true
        type: string
      worker_name:
        description: "Cloudflare Worker Name (e.g. pm-school-dps-delhi)"
        required: true
        type: string
      d1_database_id:
        description: "Dedicated D1 Database UUID"
        required: true
        type: string
      r2_bucket_name:
        description: "Dedicated R2 Bucket Name"
        required: true
        type: string
      custom_domain:
        description: "Optional Custom Domain (e.g. erp.dpsdelhi.in)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Static Assets
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_WEB_CONFIG_JSON: ${{ secrets.FIREBASE_WEB_CONFIG_JSON }}

      - name: Apply D1 Database Migrations to Dedicated Database
        run: |
          echo "Applying migrations to D1 UUID: ${{ inputs.d1_database_id }}"
          npx --yes wrangler@3.90.0 d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Dedicated Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name=${{ inputs.worker_name }}
          packageManager: npm
          postCommands: |
            echo "$AUTH_SECRET" | npx wrangler secret put AUTH_SECRET --name=${{ inputs.worker_name }}
            echo "$RAZORPAY_KEY_ID" | npx wrangler secret put RAZORPAY_KEY_ID --name=${{ inputs.worker_name }}
            echo "$RAZORPAY_KEY_SECRET" | npx wrangler secret put RAZORPAY_KEY_SECRET --name=${{ inputs.worker_name }}
            if [ -n "$FCM_SERVICE_ACCOUNT_JSON" ]; then printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | npx wrangler secret put FCM_SERVICE_ACCOUNT_JSON --name=${{ inputs.worker_name }}; fi
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}

      - name: Report Deployment Success
        run: |
          echo "✅ Dedicated School Worker deployed successfully!"
          echo "Worker: ${{ inputs.worker_name }}"
          echo "Slug: ${{ inputs.school_slug }}"
          echo "D1 UUID: ${{ inputs.d1_database_id }}"
