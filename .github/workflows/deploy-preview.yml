name: Deploy Preview (branch preview of the production Worker)

# WHAT THIS DOES
#
#   push to a feature branch  ->  a Preview of the `school-management` Worker
#   merge to main             ->  production, via deploy.yml
#
# A Preview is a full, production-like environment of the SAME Worker, on its own
# URL, with its own variables, secrets and bindings. It is not a separate Worker.
#
# This replaces `[env.preview]` + the `school-management-preview` Worker. That
# model is a Wrangler environment, which Cloudflare documents for persistent
# staging environments and not for branch testing, and which needed two
# workarounds that only existed because it was a separate Worker:
#
#   - `routes = []`, otherwise the env inherited `pragnya.nasven.com/*` and
#     deployed over production's route.
#   - SEND_EMAIL was bound, which let anyone with the URL send real email from
#     the real domain.
#
# A Preview takes no zone routes and no cron triggers, so neither workaround is
# possible any more. See wrangler.toml for the settings and the reasoning.
#
# Requires wrangler >= 4.135.0. Do not lower the pin below that.

on:
  workflow_dispatch:
  push:
    # `branches-ignore` only, never alongside `branches` -- GitHub rejects both
    # filters on the same event, and the workflow would fail to load at all.
    # This is "every branch except main", which is the branch model: a feature
    # branch gets a Preview, and main is handled by deploy.yml.
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # One preview per branch. A newer push supersedes an in-flight run, so a
  # branch that is pushed twice in quick succession does not deploy twice, and
  # does not race its own D1 migrations.
  group: preview-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  # Worker Previews require wrangler >= 4.135.0. The project pin lives in
  # package.json devDependencies (exact) and package-lock.json, and `npm ci`
  # installs it, so this job and deploy.yml run the same wrangler. The repo
  # previously ran three different builds at once: 3.90.0 for production
  # migrations, 4.47.0 for the preview, and a floating `wrangler@4` in three
  # scripts -- so production and preview were not even using the same tool, and a
  # wrangler release could change production behaviour with no commit for it.
  WRANGLER_MIN: "4.135.0"

jobs:
  preview:
    name: Branch preview + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - run: npm ci

      # A red harness must not produce a deployed preview, let alone a deployment
      # someone then tests and trusts.
      - name: Verify Phase 0 (internal M2M signing)
        run: node scripts/verify-phase0-signing.mjs

      # Routing is a static property of the wrangler configs, so this needs no
      # database and no deploy. It lives here rather than only on PRs because the
      # wildcard it forbids looks like a harmless safety net and only breaks
      # schools mid-provisioning in production.
      - name: Verify routing contract
        run: node scripts/verify-routing.mjs

      # A school-scoped table that no migration copies into a dedicated D1 is
      # invisible from the deploy: copyTable is only called for names already in
      # the list, so the omission cannot be observed. Phase 1 and Phase 2 each
      # added tables and the list was not updated, which is how
      # parent_student_links, fee_payment_idempotency and payment_ledger were
      # being dropped on migration. Static, fast, and it cannot regress silently.
      - name: Verify dedicated-D1 table coverage
        run: node scripts/audit-dedicated-tables.mjs

      # The 0041 backfill is a DATA migration, and its value is in what it refuses
      # to link. The fixtures include a phone shared across two schools, so the
      # cross-tenant refusal is asserted rather than assumed.
      - name: Verify migration 0041 (parent_student_links backfill)
        run: node scripts/verify-migration-0041.mjs

      # The ledger that decides whether a school still needs its shared-D1 rows
      # copied. Its columns are asserted individually because the deploy writes to
      # them at run time, and a renamed column would otherwise surface as a failed
      # production deploy.
      - name: Verify migration 0042 (dedicated migration ledger)
        run: node scripts/verify-migration-0042.mjs

      # Pure-function tests for the step that resolves the Preview URL. Kept in CI
      # because the alternative is finding out the logic is wrong from a failed
      # deploy, which is how both earlier versions were found.
      - name: Verify preview URL resolution
        run: node scripts/resolve-preview-url.test.mjs

      # The billing authorisation boundary, exercised against the real api/ modules:
      # a dedicated worker forwards billing to the platform signed as itself, and the
      # platform refuses any scope that is not signed. Transpiles the real tree in
      # process, so it needs no database, no Worker and no network.
      #
      # It is here because a source-scan cannot answer the only question that
      # matters here -- does a forged request actually get refused -- and because two
      # cheaper harnesses in this repo passed while the code was wrong.
      - name: Verify billing M2M authorisation
        run: node scripts/verify-billing-m2m.mjs

      # Breaks the billing code on purpose, six ways, and fails unless the harness
      # above notices each one. Cheap (~30s) next to what it protects: a green
      # harness over unexercised code is what let a 401-on-every-dedicated-school
      # regression reach production here, and what hid it again when the harness was
      # written to assert the 401 rather than the reason for it.
      - name: Mutation-check the billing harness
        run: node scripts/mutation-check-billing-m2m.mjs

      # wrangler comes from `npm ci` via devDependencies. This step exists only to
      # turn "wrangler is too old for Previews" into a clear message here, rather
      # than a confusing failure from `wrangler preview` several steps later.
      - name: Assert wrangler supports Previews
        run: |
          set -euo pipefail
          GOT=$(npx wrangler --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          echo "wrangler $GOT (minimum ${{ env.WRANGLER_MIN }})"
          [ -n "$GOT" ] || { echo "::error::could not determine the wrangler version"; exit 1; }
          node -e "
            const [got, min] = process.argv.slice(1).map(s => s.split('.').map(Number));
            const ok = got[0] > min[0]
              || (got[0] === min[0] && (got[1] > min[1] || (got[1] === min[1] && got[2] >= min[2])));
            if (!ok) {
              console.error('::error::wrangler ' + process.argv[1] + ' is older than ' + process.argv[2]
                + ', which Worker Previews require. Bump the wrangler devDependency.');
              process.exit(1);
            }
          " "$GOT" "${{ env.WRANGLER_MIN }}"

      # The [assets] block stays top level, and a Preview uploads the assets from
      # the branch being previewed. wrangler refuses to deploy when ./out is
      # missing, so the Next.js export has to exist even for an API smoke test.
      - name: Build website (satisfies [assets] directory = ./out)
        run: npm run build

      # Resolve the preview name to a DNS-safe label. It defaults to the branch
      # name, but branches like `feat/rbac` contain a `/` and cannot appear in
      # the <preview>-<worker>.<subdomain>.workers.dev hostname. Two branches that
      # sanitise to the same label (feat/a and feat-a) would share a Preview, so
      # the commit is appended to keep them distinct.
      - name: Resolve preview name
        id: meta
        env:
          RAW_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LABEL=$(printf '%s' "$RAW_BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-//; s/-$//' \
            | cut -c1-40)
          if [ -z "$LABEL" ]; then LABEL="branch"; fi
          NAME="${LABEL}-${SHA:0:7}"
          echo "branch=$RAW_BRANCH" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Preview name: $NAME (from branch '$RAW_BRANCH')"

      # Dependabot cannot deploy a Preview, and should not be made to look like
      # it tried and failed.
      #
      # GitHub withholds repository secrets from Dependabot, treating it like a
      # fork, so CLOUDFLARE_API_TOKEN resolves to the empty string. The first
      # step that needs it then fails with wrangler's own message:
      #
      #   In a non-interactive environment, it's necessary to set a
      #   CLOUDFLARE_API_TOKEN environment variable for wrangler to work.
      #
      # Which is a red X on a dependency bump that has nothing wrong with it, and
      # a red X is exactly what people learn to ignore -- which is the failure
      # mode this repository has already been bitten by twice, in the form of
      # harnesses that were written and never referenced by any workflow.
      #
      # Everything above this point needs no secret and all of it passed on the
      # Dependabot run this was written from: Phase 0 signing, the routing
      # contract, dedicated-D1 table coverage, migrations 0041 and 0042, the
      # preview-URL resolver's own tests, the billing M2M harness, and its
      # mutation check. A dependency bump is exactly when those are worth
      # running. So they keep running, and only the five steps that need either
      # the token or a Preview URL are skipped.
      - name: Explain why no Preview is deployed for this PR
        if: github.actor == 'dependabot[bot]'
        run: |
          echo "### No Preview deployed" >&2
          echo >&2
          echo 'Dependabot PRs cannot deploy a Preview: GitHub withholds' >&2
          echo 'repository secrets from Dependabot, so the Cloudflare API token' >&2
          echo 'is unavailable and the deploy cannot authenticate.' >&2
          echo >&2
          echo "Every check that needs no secret **did** run, including the"
          echo "authorization and money-integrity harnesses. Review those." >&2
          echo >&2
          echo "To exercise the Worker itself, open a branch PR by hand." >&2

      # Migrations go to the shared staging D1 only.
      #
      # `--config wrangler.preview-migrations.toml` rather than `--env preview`:
      # that file declares a single PREVIEW_DB binding pointing at the staging
      # database, so there is no binding in it that reaches production. Running
      # this against wrangler.toml would migrate the production database from a
      # branch build, because the top-level `DB` binding is the production one.
      #
      # Every branch shares this database, which is Cloudflare's documented
      # default. Re-applying is a no-op, so branches converge rather than race.
      - name: Apply migrations to the PREVIEW D1
        if: github.actor != 'dependabot[bot]'
        run: npx wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Pass 1: deploy the Preview, then work out its URL.
      #
      # `wrangler preview --json` cannot be parsed for a URL, for two reasons
      # that both had to be discovered the hard way:
      #
      #   1. `--json` is not JSON-only. Wrangler still writes progress output to
      #      stdout, so `JSON.parse` of the stream fails.
      #   2. Once past that, the document is a preview *record* -- id, slug, name,
      #      observability, resolved bindings, asset config -- with no URL field
      #      at all. The only workers.dev string in it is the `APP_BASE_URL`
      #      binding value, which is a placeholder.
      #
      # A heuristic that grabs "any workers.dev URL" therefore returns the
      # placeholder. That is what the previous version did, and the result was 23
      # smoke probes failing with "could not resolve host:
      # school-management-preview.workers.dev" while the Preview had in fact
      # deployed successfully. The real fault surfaced as the least useful
      # possible error, several steps later.
      #
      # There is also no `wrangler preview list` to ask instead.
      #
      # So the URL is constructed from the documented, fixed hostname format
      # (<preview-name>-<worker-name>.<subdomain>.workers.dev), taking the
      # preview name from wrangler's own record rather than re-deriving it, and
      # the subdomain from the API rather than a guess. It is then verified with a
      # real request, so a wrong assumption fails here and says so, instead of
      # turning into a screen of DNS errors.
      - name: Deploy preview and resolve its URL
        id: first
        if: github.actor != 'dependabot[bot]'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -euo pipefail
          npx wrangler preview --name "$PREVIEW_NAME" --json --message "${{ github.sha }}" 2>&1 | tee preview.out

          # The account's workers.dev subdomain, from the API. Guessing it is how a
          # wrong hostname reaches the smoke test unnoticed.
          SUBDOMAIN=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success)throw new Error(JSON.stringify(j.errors));process.stdout.write(j.result.subdomain);})")
          echo "workers.dev subdomain: $SUBDOMAIN"

          # No secrets yet, on purpose. `wrangler preview secret put` creates a NEW
          # deployment per call, so a loop over six secrets meant six deployments
          # and the last one won. All six go up in the second pass instead.
          #
          # `preview_urls = true` in wrangler.toml is a REQUEST. Whether a URL is
          # actually handed back additionally depends on the Worker URL "Preview"
          # switch in the Cloudflare dashboard, which is an account setting with
          # no wrangler command behind it. With that switch off, `wrangler
          # preview` deploys cleanly, returns a complete record, and reports
          # `"urls": []` -- so the failure is only observable here, and
          # resolve-preview-url.mjs below is what turns it into a named cause
          # rather than a DNS error three steps later.
          URL=$(node scripts/resolve-preview-url.mjs preview.out "$SUBDOMAIN" school-management)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "preview_name=$PREVIEW_NAME" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"

      # Pass 2: APP_BASE_URL now points at the real Preview hostname so
      # password-reset and invite links are usable, and the secrets go up in the
      # same deployment.
      #
      # PLATFORM_BOOTSTRAP_TOKEN is included so the preview exercises the same
      # /api/admin/bootstrap path as production. Without it the endpoint fails
      # closed with 503 before the token comparison runs, and the smoke probe
      # asserting "a wrong token gets 401" would pass vacuously -- which is
      # exactly the gap that let a broken constant-time comparison ship.
      #
      # SEND_EMAIL is deliberately absent, so api/lib/email.ts no-ops every send.
      - name: Deploy preview (final)
        if: github.actor != 'dependabot[bot]'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ steps.meta.outputs.name }}
          PREVIEW_URL: ${{ steps.first.outputs.url }}
        run: |
          set -euo pipefail
          {
            echo "{"
            for pair in \
              "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" \
              "PLATFORM_ADMIN_EMAIL=${{ secrets.PLATFORM_ADMIN_EMAIL }}" \
              "PLATFORM_ADMIN_PASSWORD=${{ secrets.PLATFORM_ADMIN_PASSWORD }}" \
              "PLATFORM_BOOTSTRAP_TOKEN=${{ secrets.PLATFORM_BOOTSTRAP_TOKEN }}" \
              "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" \
              "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}"
            do
              name="${pair%%=*}"
              value="${pair#*=}"
              if [ -n "$value" ]; then
                printf '  "%s": "%s",\n' "$name" "$value"
              else
                echo "::warning::preview secret $name is not set in this repo"
              fi
            done
            echo "  \"_trailing\": \"\""
            echo "}"
          } > preview.secrets.json
          # Strip the trailing comma left by the loop above.
          node -e "
            const fs = require('fs');
            const o = JSON.parse(fs.readFileSync('preview.secrets.json', 'utf-8'));
            delete o._trailing;
            fs.writeFileSync('preview.secrets.json', JSON.stringify(o));
          "
          rm -f preview.secrets.json.bak
          npx wrangler preview \
            --name "$PREVIEW_NAME" \
            --var "APP_BASE_URL:$PREVIEW_URL" \
            --secrets-file preview.secrets.json \
            --message "${{ github.sha }}"
          # The file held live credentials in a workspace on a public runner.
          shred -u preview.secrets.json 2>/dev/null || rm -f preview.secrets.json

      - name: Report preview URL
        if: github.actor != 'dependabot[bot]'
        env:
          PREVIEW_URL: ${{ steps.first.outputs.url }}
          PREVIEW_NAME: ${{ steps.meta.outputs.name }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          {
            echo "### Preview deployed"
            echo
            echo "**Branch:** \`$BRANCH\`  ·  **Preview:** \`$PREVIEW_NAME\`"
            echo
            echo '```'
            echo "$PREVIEW_URL"
            echo '```'
            echo
            echo "D1 has the migrations applied but **no production data**."
            echo "Email is a no-op here (no \`SEND_EMAIL\` binding), by design."
            echo "This Preview has no zone routes and no cron triggers."
          } >> "$GITHUB_STEP_SUMMARY"

      # The probes live in scripts/smoke-preview.mjs rather than inline here, so
      # a deployed Preview can be re-checked from a terminal and the workflow and
      # a local run can never drift apart.
      - name: Smoke test the preview API
        if: github.actor != 'dependabot[bot]'
        env:
          PREVIEW_URL: ${{ steps.first.outputs.url }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::could not determine the preview URL"
            exit 1
          fi
          node scripts/smoke-preview.mjs "$PREVIEW_URL"
