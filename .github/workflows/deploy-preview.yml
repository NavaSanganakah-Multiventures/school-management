name: Deploy Preview (non-production smoke environment)

# Deploys the platform API to the `preview` environment in wrangler.toml so a
# change can be exercised end-to-end BEFORE it goes to production.
#
# This environment has its own D1 (5d969580-4ef9-42eb-9d07-f1e08e1dc599), R2
# bucket and KV namespace, and is served from a *.workers.dev URL — it does NOT
# take the *.pragnya.nasven.com wildcard route, so production traffic is
# unaffected. No D1 data is copied in, so the preview DB starts from the
# migrations alone and a smoke test there says nothing about production data.
#
# Migrations are applied to the preview D1 only (`--env preview`). Applying them
# to production remains the deploy job's responsibility in deploy.yml.
#
# Usage:
#   gh workflow run deploy-preview.yml
#   gh run watch

on:
  workflow_dispatch:
  push:
    branches:
      - integration/phase0-2
  pull_request:
    branches:
      - main
    paths:
      - api/**
      - db_migrations/**
      - scripts/verify-phase*.mjs
      - wrangler.toml
      - .github/workflows/deploy-preview.yml

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Migrations + worker deploy + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - run: npm ci

      # Run the repo's verification harnesses first. A red harness must not
      # produce a deployed worker.
      - name: Verify Phase 0 (internal M2M signing)
        run: node scripts/verify-phase0-signing.mjs

      - name: Install wrangler
        run: npm i --no-save wrangler@4.47.0

      # The preview env inherits the top-level [assets] block, whose directory is
      # ./out. wrangler refuses to deploy when that directory is absent, so the
      # Next.js export has to exist even for an API smoke test.
      - name: Build website (satisfies [assets] directory = ./out)
        run: npm run build

      - name: Apply migrations to PREVIEW D1
        run: npx wrangler d1 migrations apply DB --env preview --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Pass 1: deploy to learn the workers.dev hostname.
      #
      # No `--var` for AUTH_SECRET here on purpose: a --var lands in the worker's
      # plain-text configuration. It is installed as a real secret further below.
      # api/lib/auth.ts fails closed when ENVIRONMENT is production/preview and
      # AUTH_SECRET is absent, so the two steps together are what let the worker
      # sign sessions.
      - name: Deploy preview worker (discover URL)
        id: first
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT=$(npx wrangler deploy --env preview 2>&1 | tee /dev/stderr)
          URL=$(printf '%s\n' "$OUT" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -n 1 || true)
          if [ -z "$URL" ]; then
            echo "::error::could not parse the preview deployment URL from wrangler output"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"

      # Pass 2: redeploy with APP_BASE_URL pointing at the real preview hostname so
      # password-reset / invite links generated by the preview worker are usable.
      - name: Deploy preview worker (final)
        id: deploy
        run: |
          URL="${{ steps.first.outputs.url }}"
          npx wrangler deploy --env preview --var "APP_BASE_URL:$URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Put preview worker secrets
        run: |
          set -euo pipefail
          # PLATFORM_BOOTSTRAP_TOKEN is included so the preview exercises the
          # same /api/admin/bootstrap code path as production. Without it the
          # endpoint fails closed with 503 and the gate's comparison logic is
          # never reached, so the smoke probe asserting "a wrong token gets
          # 401" would pass vacuously. That is exactly the gap that let a broken
          # constant-time comparison ship: the assertion could not tell a working
          # gate from one that never ran.
          for pair in \
            "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" \
            "PLATFORM_ADMIN_EMAIL=${{ secrets.PLATFORM_ADMIN_EMAIL }}" \
            "PLATFORM_ADMIN_PASSWORD=${{ secrets.PLATFORM_ADMIN_PASSWORD }}" \
            "PLATFORM_BOOTSTRAP_TOKEN=${{ secrets.PLATFORM_BOOTSTRAP_TOKEN }}" \
            "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" \
            "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}"
          do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --env preview
            else
              echo "::warning::preview secret $name is not set in this repo"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report preview URL
        run: |
          {
            echo "### Preview deployed"
            echo
            echo '```'
            echo "${{ steps.first.outputs.url }}"
            echo '```'
            echo
            echo "Preview D1 has the migrations applied but **no production data**."
          } >> "$GITHUB_STEP_SUMMARY"

      # Smoke tests. These assert the endpoints that the Phase 0/1/2 changes
      # touch, against a real running worker.
      # The probes live in scripts/smoke-preview.mjs rather than inline here, so
      # a deployed worker can be re-checked from a terminal and the workflow and
      # a local run can never drift apart. It also gets two things the inline
      # version had wrong: the workers.dev URL is taken from wrangler's own
      # stdout, and the two secret-dependent endpoints assert "not a success"
      # instead of a fixed status (503 when the bootstrap token is absent, 401
      # when it is set; 500 when the webhook secret is absent, 400 when set).
      - name: Smoke test the preview API
        run: |
          set -euo pipefail
          URL="${{ steps.first.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "::error::could not determine the preview deployment URL"
            exit 1
          fi
          node scripts/smoke-preview.mjs "$URL"

