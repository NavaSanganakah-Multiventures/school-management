name: Deploy Preview (non-production smoke environment)

# Deploys the platform API to the `preview` environment in wrangler.toml so a
# change can be exercised end-to-end BEFORE it goes to production.
#
# This environment has its own D1 (5d969580-4ef9-42eb-9d07-f1e08e1dc599), R2
# bucket and KV namespace, and is served from a *.workers.dev URL — it does NOT
# take the *.pragnya.nasven.com wildcard route, so production traffic is
# unaffected. No D1 data is copied in, so the preview DB starts from the
# migrations alone and a smoke test there says nothing about production data.
#
# Migrations are applied to the preview D1 only (`--env preview`). Applying them
# to production remains the deploy job's responsibility in deploy.yml.
#
# Usage:
#   gh workflow run deploy-preview.yml
#   gh run watch

on:
  workflow_dispatch:
  push:
    branches:
      - integration/phase0-2
  pull_request:
    branches:
      - main
    paths:
      - api/**
      - db_migrations/**
      - scripts/verify-phase*.mjs
      - wrangler.toml
      - .github/workflows/deploy-preview.yml

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Migrations + worker deploy + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - run: npm ci

      # Run the repo's verification harnesses first. A red harness must not
      # produce a deployed worker.
      - name: Verify Phase 0 (internal M2M signing)
        run: node scripts/verify-phase0-signing.mjs

      - name: Install wrangler
        run: npm i --no-save wrangler@4.47.0

      - name: Apply migrations to PREVIEW D1
        run: npx wrangler d1 migrations apply DB --env preview --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # No `--var` for AUTH_SECRET here on purpose: a --var lands in the worker's
      # plain-text configuration. It is installed as a real secret in the next
      # step. api/lib/auth.ts fails closed when ENVIRONMENT is production/preview
      # and AUTH_SECRET is absent, so the two steps together are what let the
      # worker sign sessions.
      - name: Deploy preview worker
        id: deploy
        run: npx wrangler deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Put preview worker secrets
        run: |
          set -euo pipefail
          for pair in \
            "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" \
            "PLATFORM_ADMIN_EMAIL=${{ secrets.PLATFORM_ADMIN_EMAIL }}" \
            "PLATFORM_ADMIN_PASSWORD=${{ secrets.PLATFORM_ADMIN_PASSWORD }}" \
            "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" \
            "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}"
          do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --env preview
            else
              echo "::warning::preview secret $name is not set in this repo"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report preview URL
        run: |
          {
            echo "### Preview deployed"
            echo
            echo '```'
            echo "${{ steps.deploy.outputs.deployment-url }}"
            echo '```'
            echo
            echo "Preview D1 has the migrations applied but **no production data**."
          } >> "$GITHUB_STEP_SUMMARY"

      # Smoke tests. These assert the endpoints that the Phase 0/1/2 changes
      # touch, against a real running worker.
      - name: Smoke test the preview API
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.deployment-url }}"
          URL="${URL%/}"
          fail=0

          probe() {
            local desc="$1" expect="$2" path="$3"
            local code
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --connect-timeout 10 --max-time 25 "$URL$path" || echo 000)
            if [ "$code" = "$expect" ]; then
              echo "  PASS  $desc  ($path -> $code)"
            else
              echo "  FAIL  $desc  ($path -> $code, expected $expect)"
              head -c 300 /tmp/body || true
              echo
              fail=1
            fi
          }

          echo "Smoke testing $URL"

          # public
          probe "health endpoint"                 200 /api/health
          probe "public config"                   200 /api/config/

          # Phase 0: bootstrap must be GATED (401 without the token) and must
          # NOT have silently created an admin.
          probe "bootstrap is gated without token" 401 /api/admin/bootstrap

          # Phase 1: authenticated reads must be 401 without a session.
          probe "students list requires auth"      401 /api/students
          probe "staff list requires auth"         401 /api/staff
          probe "fees list requires auth"          401 /api/fees
          probe "student history requires auth"    401 /api/students/std-1/history
          probe "notification topics require auth" 401 /api/notifications/topics
          probe "leave list requires auth"         401 /api/leave-applications
          probe "attendance register requires auth" 401 /api/attendance

          # Phase 2: payment endpoints must be auth-gated, never open.
          probe "fee pay requires auth"            401 /api/fees/pay
          probe "fee create-bulk requires auth"    401 /api/fees/create-bulk
          probe "recurring subscribe requires auth" 401 /api/billing/subscribe-recurring

          # Webhook must reject an unsigned body.
          probe "razorpay webhook rejects unsigned" 400 /api/webhooks/razorpay

          exit $fail
