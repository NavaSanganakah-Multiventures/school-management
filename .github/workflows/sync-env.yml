name: Sync Zero-DB-Cost Edge Environment (Pragnya Mitra)

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: "Cloudflare Worker Name to update"
        required: true
        type: string
      school_name:
        description: "School Name"
        required: true
        type: string
      school_id:
        description: "School ID"
        required: true
        type: string
      contact_phone:
        description: "School Contact Phone"
        required: false
        type: string
      contact_email:
        description: "School Contact Email"
        required: false
        type: string
      academic_session:
        description: "Academic Session (e.g. 2026-2027)"
        required: false
        type: string
        default: "2026-2027"

permissions:
  contents: read

jobs:
  sync-edge-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Wrangler
        run: npm install wrangler@3.90.0 --no-save

      - name: Hot-Sync Worker Secrets (Zero-DB Cost Edge Update)
        run: |
          echo "Updating edge environment for worker: ${{ inputs.worker_name }}"
          echo "${{ inputs.school_name }}" | npx wrangler secret put SCHOOL_NAME --name=${{ inputs.worker_name }}
          echo "${{ inputs.school_id }}" | npx wrangler secret put SCHOOL_ID --name=${{ inputs.worker_name }}
          if [ -n "${{ inputs.contact_phone }}" ]; then echo "${{ inputs.contact_phone }}" | npx wrangler secret put CONTACT_PHONE --name=${{ inputs.worker_name }}; fi
          if [ -n "${{ inputs.contact_email }}" ]; then echo "${{ inputs.contact_email }}" | npx wrangler secret put CONTACT_EMAIL --name=${{ inputs.worker_name }}; fi
          if [ -n "${{ inputs.academic_session }}" ]; then echo "${{ inputs.academic_session }}" | npx wrangler secret put ACADEMIC_SESSION --name=${{ inputs.worker_name }}; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Completed
        run: echo "✅ Worker environment variables hot-synced successfully with zero DB cost!"
