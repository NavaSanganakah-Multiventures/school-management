# =============================================================================
# Super Admin Console — Dedicated Worker (admin.pragnya.nasven.com)
#
# Serves the Flutter web Super Admin app (flutter_apps/super_admin_app)
# as static assets + the full platform API (api/index.ts), so /api/admin/*
# works on the same origin (no CORS issues for the Flutter app).
#
# This worker owns admin.pragnya.nasven.com outright. It used to rely on winning
# a precedence contest against the platform worker's `*.pragnya.nasven.com/*`
# wildcard; that wildcard is gone (see wrangler.toml), so the route below is the
# only thing serving this host and does not have to out-rank anything.
#
# IMPORTANT:
#   - No IS_DEDICATED_WORKER / SCHOOL_ID vars → the /api/admin/* routes stay
#     enabled (the shared worker explicitly blocks them on dedicated workers).
#   - No [triggers] → cron (trial expiry etc.) stays exclusively on the
#     platform worker to avoid duplicate processing.
# =============================================================================
name = "school-management-admin"
main = "./api/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Super Admin console domain — the platform worker no longer holds a wildcard, so
# this host is claimed outright.
[[routes]]
pattern = "admin.pragnya.nasven.com/*"
zone_name = "nasven.com"

# Super Admin Flutter web frontend — auto-served like the shared worker.
# Build: cd flutter_apps/super_admin_app && flutter build web --release
[assets]
directory = "./flutter_apps/super_admin_app/build/web"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
ENVIRONMENT = "production"
APP_BASE_URL = "https://admin.pragnya.nasven.com"

# Shared production data plane — SAME D1/R2/KV as the platform worker, so the
# Super Admin console manages the real production tenants.
[[d1_databases]]
binding = "DB"
database_id = "16648fed-788d-4780-a877-fac56d9b5d27"
migrations_dir = "./db_migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "school-management-production"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "393901911be84d558822c78070a82e94"

# Cloudflare Email binding. Without it, api/lib/email.ts short-circuits every
# send, so Super Admin password recovery silently fails while the API reports
# success. The sending domain must be onboarded in Cloudflare Email Service.
[[send_email]]
name = "SEND_EMAIL"
